vertical: real_estate
display_name: "Real Estate Agent"

inbox_agent:
  tone: "warm, professional, responsive"
  priorities:
    - new property inquiries
    - offer updates
    - viewing requests
  auto_reply: true
  escalate_keywords:
    - "offer"
    - "urgent"
    - "withdraw"
    - "cancel"
    - "angry"
    - "frustrated"
    - "deal"
    - "negotiate"

follow_up_agent:
  sequences:
    cold_lead:    [1, 3, 7, 30]
    warm_lead:    [1, 3, 7]
    post_showing: [1, 4]
  context_fields:
    - budget
    - timeline
    - pre_approved
    - property_type
    - preferred_area
    - family_size

research_agent:
  sources:
    - tavily_search
    - google_maps
    - public_records
    - property_news
  output_format: showing_brief
  schedule: weekly

social_trend_agent:
  platforms:
    - tiktok
    - instagram
  topics:
    - "property tour"
    - "real estate tips"
    - "house hunting"
    - "home decor"
    - "investment property"
    - "first time buyer"
  schedule: daily

marketing_agent:
  platforms:
    - instagram
    - facebook
    - whatsapp_broadcast
  post_frequency: 5_per_week
  content_mix:
    listing_spotlight: 40
    market_tips: 30
    local_area: 20
    personal_brand: 10

admin_agent:
  documents:
    - buyer_representation_agreement
    - listing_agreement
    - offer_letter
    - viewing_confirmation
  integrations:
    - google_calendar
    - docusign

briefing_agent:
  schedule: "07:00"
  timezone: "Asia/Kuala_Lumpur"
  sections:
    - urgent_inbox
    - leads_to_touch_today
    - pending_approvals
    - deals_with_deadlines
    - content_going_live_today

kb_fields:
  company:
    - name
    - owner_name
    - license_number
    - brand_voice
    - contact_number
    - office_address
    - social_handles
  listing:
    - name
    - address
    - property_type
    - tenure
    - developer
    - price_range
    - price_psf
    - bedrooms
    - bathrooms
    - land_area
    - built_up
    - facilities
    - nearby_amenities
    - selling_points
    - target_buyer
    - investment_potential
  business_rules:
    - always_ask
    - never_promise
    - escalate_triggers
    - follow_up_timing
    - preferred_channels
    - viewing_hours
    - compliance_notes
