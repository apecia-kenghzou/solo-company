version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soloagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - soloagent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - soloagent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible self-hosted object storage
  # API:     http://localhost:9000  (S3 endpoint)
  # Console: http://localhost:9001  (web UI — login minioadmin / minioadmin)
  #
  # After first boot, set the bucket policy to allow public reads:
  #   docker exec -it solo-minio mc alias set local http://localhost:9000 minioadmin minioadmin
  #   docker exec -it solo-minio mc policy set download local/solo-agent-files
  #
  # To use Garage instead, comment out this service and update .env:
  #   S3_PROVIDER=garage
  #   S3_ENDPOINT_URL=http://garage:3900
  #   S3_PUBLIC_URL_BASE=http://localhost:3902/solo-agent-files
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: solo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - soloagent-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the bucket and sets public-read policy on first run
  minio-init:
    image: minio/minio:latest
    container_name: solo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - soloagent-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/solo-agent-files &&
        mc policy set download local/solo-agent-files &&
        echo 'MinIO bucket ready.'
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - soloagent-net
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - soloagent-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A workers.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - soloagent-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - soloagent-net

networks:
  soloagent-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  minio_data:
